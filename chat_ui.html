<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MiniMax 办公 AI 智能助手</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --user-msg: #2563eb;
      --ai-msg: #334155;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 14px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }
    .header-right button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .header-right button:hover {
      background: #334155;
      color: #fff;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      display: flex;
      gap: 12px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }
    .message.user { flex-direction: row-reverse; }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .message.user .avatar { background: #3b82f6; }
    .message.ai .avatar { background: #10b981; }
    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 15px;
      word-break: break-word;
      max-width: calc(100% - 60px);
    }
    .message.user .bubble {
      background: var(--user-msg);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .message.ai .bubble {
      background: var(--ai-msg);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
      border: 1px solid var(--border);
    }
    .bubble pre {
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid #334155;
    }
    .bubble code {
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }
    .bubble p:not(:last-child) { margin-bottom: 8px; }
    
    #prompt-suggestions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 860px;
      margin: 40px auto 20px auto;
      padding: 0 10px;
    }
    .suggestion-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-sub);
      transition: all 0.2s;
    }
    .suggestion-card:hover {
      border-color: var(--accent);
      color: var(--text-main);
      transform: translateY(-2px);
    }

    footer {
      padding: 14px 20px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
    }
    .input-box {
      max-width: 860px;
      margin: 0 auto;
      position: relative;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 15px;
      resize: none;
      height: 52px;
      max-height: 160px;
      line-height: 1.4;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    button#send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      width: 52px;
      height: 52px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    button#send-btn:hover { background: var(--accent-hover); }
    button#send-btn:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h2 style="font-size: 17px; font-weight: 600;">MiniMax 办公 AI 智能助手</h2>
      <div class="status-badge"><span class="dot"></span>服务就绪</div>
    </div>
    <div class="header-right">
      <button onclick="clearChat()">清空对话</button>
    </div>
  </header>

  <div id="chat-container">
    <div id="prompt-suggestions">
      <div class="suggestion-card" onclick="usePrompt(this)">✍️ 帮我润色一份周报与项目进展总结</div>
      <div class="suggestion-card" onclick="usePrompt(this)">📄 请帮我起草一份正式的商务合作方案</div>
      <div class="suggestion-card" onclick="usePrompt(this)">🌐 将以下中文资料专业翻译成地道英文</div>
      <div class="suggestion-card" onclick="usePrompt(this)">💡 梳理会议纪要并提炼关键待办事项 (TODO)</div>
    </div>
  </div>

  <footer>
    <div class="input-box">
      <textarea id="user-input" placeholder="输入办公任务或提问... (Enter 发送，Shift+Enter 换行)" onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const suggestions = document.getElementById('prompt-suggestions');
    let messages = [];

    function usePrompt(el) {
      userInput.value = el.innerText.replace(/^[^\s]+\s*/, '');
      userInput.focus();
    }

    function clearChat() {
      messages = [];
      chatContainer.innerHTML = '';
      if (suggestions) chatContainer.appendChild(suggestions);
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function appendMessage(role, content) {
      if (suggestions && suggestions.parentNode) {
        suggestions.parentNode.removeChild(suggestions);
      }
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = `
        <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
        <div class="bubble">${marked.parse(content || '')}</div>
      `;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div.querySelector('.bubble');
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      userInput.value = '';
      sendBtn.disabled = true;

      messages.push({ role: 'user', content: text });
      appendMessage('user', text);

      const aiBubble = appendMessage('ai', '正在深入思考中...');

      try {
        const resp = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'minimax-m3',
            messages: messages,
            stream: true
          })
        });

        if (!resp.ok) throw new Error('网络请求异常 ' + resp.status);

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        aiBubble.innerHTML = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const dataStr = line.slice(6).trim();
              if (dataStr === '[DONE]') break;
              try {
                const parsed = JSON.parse(dataStr);
                const delta = parsed.choices?.[0]?.delta?.content || '';
                if (delta) {
                  fullText += delta;
                  aiBubble.innerHTML = marked.parse(fullText);
                  chatContainer.scrollTop = chatContainer.scrollHeight;
                }
              } catch (e) {}
            }
          }
        }
        if (!fullText) fullText = '（已完成）';
        messages.push({ role: 'assistant', content: fullText });
      } catch (err) {
        aiBubble.innerHTML = `<span style="color:#ef4444;">抱歉，生成遇到错误：${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
